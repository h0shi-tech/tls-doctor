[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tls-doctor"
version = "0.1.0"
description = "CI-friendly TLS configuration diagnostics with actionable findings"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vlad Nikishin" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "tls",
    "ssl",
    "certificate",
    "https",
    "hsts",
    "ci",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
tls-doctor = "tls_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/h0shi-tech/tls-doctor"
Repository = "https://github.com/h0shi-tech/tls-doctor"
Issues = "https://github.com/h0shi-tech/tls-doctor/issues"

[tool.setuptools]
packages = ["tls_doctor"]
